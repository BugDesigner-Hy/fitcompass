<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>正在返回健身指北…</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: #f6f7f8;
        color: #172026;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 26rem;
        padding: 2rem;
        border: 1px solid #dfe3e5;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 1rem 3rem rgb(23 32 38 / 8%);
        text-align: center;
      }

      strong {
        color: #087e8b;
      }

      a {
        color: #087e8b;
        font-weight: 600;
      }
    </style>
    <script>
      ;(() => {
        const base = '/fitcompass'
        const path = window.location.pathname
        const rest =
          path === base || path === base + '/'
            ? '/'
            : path.startsWith(base + '/')
              ? path.slice(base.length)
              : '/'
        const target =
          base +
          '/?redirect=' +
          encodeURIComponent(
            rest + window.location.search + window.location.hash,
          )
        window.location.replace(target)
      })()
    </script>
  </head>
  <body>
    <main>
      <p><strong>健身指北</strong>正在返回交互式人体图谱…</p>
      <p><a href="/fitcompass/">如果没有自动跳转，请点这里</a></p>
    </main>
  </body>
</html>
